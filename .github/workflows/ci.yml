name: Application CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Validate academy configuration
        run: npm run academy:check

      - name: Test bounded Firebase credential-path discovery
        run: node --test tests/roles/firebase-credential-paths.test.mjs

      - name: Test academy configuration and module boundaries
        run: node --test tests/roles/academy-template.test.mjs tests/roles/academy-launch.test.mjs

      - name: Test Firestore security boundaries
        run: npm run test:firestore-rules

      - name: Test teacher course query authorization
        # Separate invocation keeps each rule test environment isolated.
        run: npx firebase emulators:exec --config firebase.test.json --only firestore "node --test tests/firestore/teacher-course-queries.rules.test.mjs tests/firestore/people-pagination.rules.test.mjs"

      - name: Test transactional role-change safeguards
        run: npx firebase emulators:exec --config firebase.test.json --only firestore --project demo-cloudai-role-tests "node --test tests/firestore/role-change.transaction.test.mjs"

      - name: Test billing payments
        run: npm run test:billing

      - name: Test role access matrix
        run: npm run test:roles

      - name: Test callable and Telegram role consistency
        run: node --test tests/roles/admin-callable.test.mjs tests/roles/telegram-access.test.mjs tests/roles/route-guard.test.mjs

      - name: Test responsive layout contracts
        run: npm run test:layout

      - name: Test learning record integrity
        run: node --test tests/roles/learning-records.test.mjs

      - name: Test ZIP import parser and API
        run: node --test tests/roles/lesson-zip-import.test.mjs tests/roles/interactive-import.test.mjs tests/roles/course-package.test.mjs tests/roles/lesson-import-api.test.mjs

      - name: Install isolated lesson test browser
        run: npx playwright install --with-deps chromium

      - name: Test interactive lesson browser isolation
        run: node --test tests/roles/interactive-player.browser.test.mjs tests/roles/course-upload.browser.test.mjs

      - name: Test contextual workspace and role confirmation browser behavior
        run: node --test tests/roles/workspace.browser.test.mjs

      - name: Test CSP and JSON-LD security boundaries
        run: node --test tests/roles/security-headers.browser.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.example.invalid
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-project.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-app

      - name: Smoke test built production headers and startup
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3107 > "$RUNNER_TEMP/cloudai-production-smoke.log" 2>&1 &
          academy_smoke_pid=$!
          trap 'kill "$academy_smoke_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3107/ > /dev/null; then break; fi
            sleep 1
          done
          ACADEMY_SMOKE_BASE_URL=http://127.0.0.1:3107 node --test tests/roles/production-build-smoke.test.mjs

  functions:
    name: Firebase Functions lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
